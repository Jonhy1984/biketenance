<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Biketenance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F1115">
  <!-- App instalable: ficha de la app (manifiesto) e icono -->
  <link rel="manifest" href="manifest.json">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --fondo: #0F1115; --tarjeta: #1A1D23; --tarjeta2: #22262E; --borde: #2A2F38; --linea: #23272F;
      --texto: #F2F3F5; --suave: #A3A9B5; --tenue: #7C8391;
      --naranja: #FF7A1A; --naranja-suave: rgba(255, 122, 26, 0.14);
      --rojo: #FF5C5C; --amarillo: #F5C542; --verde: #3DD68C; --gris: #7C8391; --azul: #7FB2FF;
      --abajo: env(safe-area-inset-bottom, 0px); --arriba: env(safe-area-inset-top, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; margin: 0; background: var(--fondo); color: var(--texto);
      font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 15px; }
    button, input, select { font-family: inherit; }
    #app { position: relative; height: 100%; max-width: 560px; margin: 0 auto; overflow: hidden; background: var(--fondo); }
    #pantallas { position: absolute; inset: 0; }

    /* ---------- Pantallas (cada una se desliza encima de la anterior) ---------- */
    .pantalla { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--fondo);
      transition: transform .26s cubic-bezier(.2, .8, .2, 1), opacity .26s; }
    .pantalla.entra, .pantalla.sale { transform: translateX(100%); }
    .pantalla.detras { transform: translateX(-22%); opacity: 0; pointer-events: none; }
    .pantalla.oculta { display: none; }
    .cuerpo { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 8px 18px 110px; -webkit-overflow-scrolling: touch; }
    .sin-barra .cuerpo { padding-bottom: 28px; }
    .barra-sup { display: flex; align-items: center; gap: 6px; padding: calc(10px + var(--arriba)) 10px 8px; min-height: 60px; }
    .barra-sup h1 { flex: 1; margin: 0; font-size: 17px; font-weight: 700; text-align: center; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; }
    .barra-sup .hueco { width: 44px; height: 44px; flex-shrink: 0; }
    .titulo-grande { display: flex; justify-content: space-between; align-items: flex-end; padding: calc(30px + var(--arriba)) 0 14px; }
    .titulo-grande .pre { font-size: 13px; color: var(--suave); font-weight: 500; margin-bottom: 4px; }
    .titulo-grande h1 { margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.6px; color: var(--naranja); }
    .pie { padding: 12px 18px calc(14px + var(--abajo)); border-top: 1px solid var(--linea); background: #13161B; display: flex; gap: 10px; }
    .pie .boton { flex: 1; }

    /* ---------- Barra de abajo ---------- */
    #barra { position: absolute; left: 0; right: 0; bottom: 0; height: calc(70px + var(--abajo)); padding: 0 8px var(--abajo);
      background: rgba(21, 24, 29, .96); border-top: 1px solid var(--linea); display: grid;
      grid-template-columns: repeat(5, 1fr); align-items: center; z-index: 5; transition: transform .25s; }
    #app.sin-barra #barra { transform: translateY(calc(100% + 40px)); }
    .pestana { background: none; border: 0; color: var(--tenue); display: flex; flex-direction: column; align-items: center;
      gap: 4px; font-size: 11px; font-weight: 600; padding: 8px 0; cursor: pointer; }
    .pestana.activa { color: var(--naranja); }
    .pestana .ico-tab { position: relative; display: inline-flex; }
    .globo { position: absolute; top: -6px; left: 14px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
      font-size: 11px; font-weight: 800; color: #0F1115; display: flex; align-items: center; justify-content: center;
      border: 2px solid #15181D; box-sizing: content-box; }
    .pestana .gordo { width: 50px; height: 50px; border-radius: 25px; background: var(--naranja); color: #0F1115; display: flex;
      align-items: center; justify-content: center; margin-top: -22px; box-shadow: 0 6px 20px rgba(255, 122, 26, .4); }

    /* ---------- Piezas básicas ---------- */
    .seccion { display: flex; justify-content: space-between; align-items: center; margin: 26px 2px 10px; }
    .seccion h2 { margin: 0; font-size: 18px; font-weight: 700; }
    .seccion .extra { font-size: 13px; color: var(--suave); }
    .tarjeta { background: var(--tarjeta); border-radius: 18px; padding: 16px; }
    .lista { background: var(--tarjeta); border-radius: 18px; overflow: hidden; }
    .fila { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--linea);
      background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; color: inherit; text-align: left;
      font-size: inherit; cursor: pointer; }
    div.fila { cursor: default; }
    .lista > div > .fila:last-child { border-bottom: 0; }
    .lista > .fila:last-child { border-bottom: 0; }
    .fila .texto { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .fila .t1 { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
    .fila .t2 { font-size: 13px; color: var(--suave); }
    .fila .chev { color: var(--tenue); flex-shrink: 0; }
    .raya { width: 4px; align-self: stretch; min-height: 34px; border-radius: 2px; flex-shrink: 0; }
    .pastilla { font-size: 12px; font-weight: 800; padding: 4px 9px; border-radius: 10px; color: #0F1115; white-space: nowrap; }
    .pastilla.gris { background: var(--tarjeta2); color: var(--suave); }
    .sub { color: var(--suave); font-size: 13px; line-height: 1.45; }
    .vacio { text-align: center; padding: 40px 20px; color: var(--suave); }
    .vacio .ico { width: 64px; height: 64px; border-radius: 32px; margin: 0 auto 14px; background: var(--tarjeta);
      display: flex; align-items: center; justify-content: center; color: var(--naranja); }
    .vacio b { display: block; color: var(--texto); font-size: 17px; margin-bottom: 6px; }

    .boton { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 18px;
      border-radius: 14px; border: 0; font-size: 15px; font-weight: 700; cursor: pointer; background: var(--tarjeta2); color: var(--texto); }
    .boton.principal { background: var(--naranja); color: #0F1115; }
    .boton.peligro { background: rgba(255, 92, 92, .12); color: var(--rojo); }
    .boton.peligro.seguro { background: var(--rojo); color: #0F1115; }
    .boton.ancho { width: 100%; }
    .boton.chico { min-height: 38px; padding: 0 14px; font-size: 14px; border-radius: 12px; }
    .boton:disabled { opacity: .5; }
    .boton-ico { width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--borde); background: var(--tarjeta);
      color: var(--texto); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
    .boton-ico.limpio { border: 0; background: none; }
    .girando svg { animation: girar 1s linear infinite; }
    @keyframes girar { to { transform: rotate(360deg); } }

    /* Formularios */
    .campo { display: block; margin-bottom: 14px; }
    .campo > span { display: block; font-size: 13px; color: var(--suave); font-weight: 600; margin: 0 0 6px 2px; }
    .campo input, .campo select { width: 100%; min-height: 50px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--borde);
      background: var(--tarjeta); color: var(--texto); font-size: 16px; outline: none; }
    .campo input:focus, .campo select:focus { border-color: var(--naranja); }
    .campo input[type=date] { color-scheme: dark; }
    .campo .ayuda { font-size: 12px; color: var(--tenue); margin: 6px 2px 0; line-height: 1.4; }
    .dos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chips.rodar { flex-wrap: nowrap; overflow-x: auto; margin: 0 -18px; padding: 0 18px 2px; scrollbar-width: none; }
    .chips.rodar::-webkit-scrollbar { display: none; }
    .chip { min-height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid var(--borde); background: var(--tarjeta);
      color: var(--suave); font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
    .chip.si { background: var(--naranja-suave); border-color: var(--naranja); color: var(--naranja); }
    .segmento { display: flex; background: var(--tarjeta); border-radius: 14px; padding: 4px; gap: 4px; }
    .segmento button { flex: 1; min-height: 40px; border: 0; border-radius: 11px; background: none; color: var(--suave);
      font-size: 14px; font-weight: 700; cursor: pointer; }
    .segmento button.si { background: var(--tarjeta2); color: var(--texto); }
    .interruptor { display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .interruptor input { appearance: none; -webkit-appearance: none; width: 50px; height: 30px; border-radius: 15px;
      background: var(--borde); position: relative; flex-shrink: 0; cursor: pointer; transition: background .2s; margin: 0; }
    .interruptor input::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 12px;
      background: #fff; transition: left .2s; }
    .interruptor input:checked { background: var(--naranja); }
    .interruptor input:checked::after { left: 23px; }
    .casilla { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--borde); background: none; color: #0F1115;
      display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; padding: 0; }
    .casilla.si { background: var(--naranja); border-color: var(--naranja); }
    .casilla svg { opacity: 0; }
    .casilla.si svg { opacity: 1; }

    /* Garaje */
    .estado-sync { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--suave); margin-top: -4px;
      background: none; border: 0; padding: 4px 0; cursor: pointer; text-align: left; }
    .punto { width: 8px; height: 8px; border-radius: 4px; flex-shrink: 0; }
    .numeros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
    .numero { background: var(--tarjeta); border-radius: 18px; padding: 14px; }
    .numero b { display: block; font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
    .numero span { font-size: 12px; color: var(--suave); font-weight: 600; }
    .bici-card { display: flex; align-items: center; gap: 14px; width: 100%; padding: 16px; background: var(--tarjeta);
      border-radius: 20px; border: 0; color: inherit; text-align: left; cursor: pointer; margin-bottom: 10px; font-size: inherit; }
    .bici-ico { width: 54px; height: 54px; border-radius: 16px; background: var(--naranja-suave); color: var(--naranja);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .bici-card .nombre { font-size: 17px; font-weight: 700; }
    .contador { min-width: 30px; height: 30px; padding: 0 9px; border-radius: 15px; display: flex; align-items: center;
      justify-content: center; font-size: 13px; font-weight: 800; color: #0F1115; flex-shrink: 0; }
    .todo-bien { display: flex; align-items: center; gap: 12px; }
    .todo-bien .ok { width: 40px; height: 40px; border-radius: 20px; background: rgba(61, 214, 140, .15); color: var(--verde);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

    /* Bici y pieza */
    .heroe { position: relative; overflow: hidden; background: var(--tarjeta); border-radius: 24px; padding: 20px; margin-bottom: 16px; }
    .heroe::before { content: ''; position: absolute; right: -60px; top: -60px; width: 200px; height: 200px; border-radius: 100px;
      background: radial-gradient(circle closest-side, rgba(255, 122, 26, .24), rgba(255, 122, 26, 0)); }
    .heroe > * { position: relative; }
    .heroe .tipo { display: inline-block; font-size: 12px; font-weight: 700; color: var(--naranja); background: var(--naranja-suave);
      padding: 4px 10px; border-radius: 10px; text-transform: capitalize; }
    .heroe .grande { font-size: 40px; font-weight: 900; letter-spacing: -1.2px; margin: 12px 0 2px; }
    .heroe .grande small { font-size: 18px; font-weight: 700; color: var(--suave); letter-spacing: 0; margin-left: 4px; }
    .heroe .mini { display: flex; gap: 18px; margin-top: 14px; }
    .heroe .mini div { font-size: 12px; color: var(--suave); font-weight: 600; }
    .heroe .mini b { display: block; font-size: 17px; color: var(--texto); }
    .grupo { margin-bottom: 12px; }
    .grupo-boton { display: flex; align-items: center; gap: 10px; width: 100%; padding: 15px 16px; background: none; border: 0;
      color: var(--texto); font-size: 15px; font-weight: 700; text-align: left; cursor: pointer; }
    .grupo-boton .cuenta { color: var(--tenue); font-weight: 600; flex: 1; }
    .grupo-boton .chev { color: var(--tenue); transition: transform .2s; }
    .grupo-boton.abierto .chev { transform: rotate(90deg); }
    .grupo-boton.abierto { border-bottom: 1px solid var(--linea); }
    .grupo-cab { display: flex; align-items: center; gap: 8px; padding: 0 4px 8px; font-size: 13px; font-weight: 700;
      color: var(--suave); text-transform: uppercase; letter-spacing: .5px; }
    .grupo-cab .cuenta { color: var(--tenue); font-weight: 600; }
    .anillo { position: relative; width: 92px; height: 92px; flex-shrink: 0; }
    .anillo svg { transform: rotate(-90deg); }
    .anillo .valor { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .anillo .valor b { font-size: 22px; font-weight: 800; }
    .anillo .valor span { font-size: 10px; color: var(--suave); font-weight: 600; }
    .etiquetas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .etiqueta { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 10px; background: var(--tarjeta2); color: var(--suave); }
    .tarea { background: var(--tarjeta); border-radius: 18px; padding: 16px; margin-bottom: 10px; }
    .tarea .cab { display: flex; align-items: center; gap: 12px; }
    .tarea .ico { width: 40px; height: 40px; border-radius: 12px; background: var(--tarjeta2); color: var(--suave);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .medidor { height: 10px; border-radius: 5px; background: var(--tarjeta2); overflow: hidden; margin: 14px 0 8px; }
    .medidor i { display: block; height: 100%; border-radius: 5px; }
    .tarea .pie-t { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .acciones { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .accion { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 16px; border-radius: 18px;
      background: var(--tarjeta); border: 0; color: var(--texto); font-size: 14px; font-weight: 700; cursor: pointer; text-align: left; }
    .accion svg { color: var(--naranja); }
    .zona-peligro { margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--linea); }

    /* Informes */
    .total-grande { font-size: 40px; font-weight: 900; letter-spacing: -1.2px; margin: 4px 0 12px; }
    .reparto { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--tarjeta2); }
    .leyenda { display: flex; gap: 16px; margin-top: 10px; font-size: 13px; color: var(--suave); flex-wrap: wrap; }
    .leyenda span { display: inline-flex; align-items: center; gap: 6px; }
    .grafico { display: flex; align-items: flex-end; gap: 10px; height: 170px; padding-top: 22px; overflow-x: auto; }
    .columna { flex: 1; min-width: 34px; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%;
      justify-content: flex-end; }
    .columna i { width: 100%; max-width: 38px; border-radius: 8px 8px 4px 4px; background: var(--naranja); min-height: 4px; }
    .columna span { font-size: 11px; color: var(--suave); font-weight: 600; }
    .columna b { font-size: 11px; color: var(--texto); font-weight: 700; white-space: nowrap; }
    .barra-h { height: 8px; border-radius: 4px; background: var(--tarjeta2); overflow: hidden; margin-top: 8px; }
    .barra-h i { display: block; height: 100%; background: var(--naranja); border-radius: 4px; }
    .baldosas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
    .baldosa { background: var(--tarjeta2); border-radius: 14px; padding: 12px 10px; }
    .baldosa b { display: block; font-size: 16px; font-weight: 800; margin-top: 6px; white-space: nowrap; }
    .baldosa span { font-size: 11px; color: var(--suave); font-weight: 600; }
    .baldosa.falta b { color: var(--tenue); font-size: 14px; }
    .buscador { position: relative; margin-bottom: 12px; }
    .buscador svg { position: absolute; left: 14px; top: 15px; color: var(--tenue); }
    .buscador input { width: 100%; min-height: 50px; padding: 0 14px 0 44px; border-radius: 14px; border: 1px solid var(--borde);
      background: var(--tarjeta); color: var(--texto); font-size: 16px; outline: none; }
    details.plegable summary { list-style: none; cursor: pointer; }
    details.plegable summary::-webkit-details-marker { display: none; }

    /* Asistente */
    .pasos { display: flex; gap: 6px; padding: 0 18px 6px; }
    .pasos i { flex: 1; height: 4px; border-radius: 2px; background: var(--borde); }
    .pasos i.si { background: var(--naranja); }
    .pregunta { margin-bottom: 18px; }
    .pregunta > span { display: block; font-size: 14px; font-weight: 700; margin: 0 0 8px 2px; }
    .pieza-asist { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--linea); }
    .pieza-asist:last-child { border-bottom: 0; }
    .pieza-asist .nom { flex: 1; min-width: 0; font-size: 15px; font-weight: 600; }
    .pieza-asist .nom small { display: block; font-size: 12px; color: var(--tenue); font-weight: 500; margin-top: 2px; }
    .pieza-asist.fuera .nom { color: var(--tenue); text-decoration: line-through; }
    .orig { font-size: 11px; font-weight: 700; padding: 6px 9px; border-radius: 9px; border: 1px solid var(--borde); background: none;
      color: var(--tenue); cursor: pointer; }
    .orig.si { border-color: var(--verde); color: var(--verde); background: rgba(61, 214, 140, .1); }

    /* Esqueleto de carga */
    .esqueleto { background: linear-gradient(90deg, var(--tarjeta) 0%, var(--tarjeta2) 50%, var(--tarjeta) 100%);
      background-size: 200% 100%; animation: brillo 1.2s infinite; border-radius: 18px; }
    @keyframes brillo { from { background-position: 100% 0; } to { background-position: -100% 0; } }

    /* Mensaje flotante */
    #mensaje { position: absolute; left: 14px; right: 14px; bottom: calc(84px + var(--abajo)); padding: 13px 16px; border-radius: 14px;
      background: #2A2F38; color: #fff; font-size: 14px; font-weight: 600; box-shadow: 0 8px 24px rgba(0, 0, 0, .45); z-index: 20;
      transition: opacity .2s, transform .2s; }
    #app.sin-barra #mensaje { bottom: calc(92px + var(--abajo)); }
    #mensaje.error { background: #B3261E; }
    #mensaje.oculto { opacity: 0; transform: translateY(12px); pointer-events: none; }

    /* Pantalla de conexión (la primera vez, o al cambiar la dirección o la clave) */
    #config { position: absolute; inset: 0; z-index: 30; background: var(--fondo); overflow-y: auto;
      padding: calc(34px + var(--arriba)) 22px calc(30px + var(--abajo)); }
    #config .logo { width: 76px; height: 76px; margin-bottom: 18px; }
    #config .logo svg { width: 100%; height: 100%; display: block; }
    #config h1 { margin: 0 0 6px; font-size: 32px; font-weight: 800; letter-spacing: -0.6px; color: var(--naranja); }
    #config .estado { min-height: 20px; margin: 2px 2px 14px; font-size: 14px; font-weight: 600; line-height: 1.4; }
  </style>
</head>
<body>
  <div id="app">
    <div id="pantallas"></div>
    <nav id="barra">
      <button type="button" class="pestana activa" data-tab="garaje"></button>
      <button type="button" class="pestana" data-tab="avisos"></button>
      <button type="button" class="pestana" data-tab="nueva"></button>
      <button type="button" class="pestana" data-tab="informes"></button>
      <button type="button" class="pestana" data-tab="ajustes"></button>
    </nav>
    <div id="mensaje" class="oculto"></div>
  </div>

  <script>
    var VERSION_APP = 'GitHub 2 (app instalable) · 16 nov 2026';

    // =====================================================================
    //  Utilidades
    // =====================================================================

    var version = 0;            // sube con cada cambio guardado: al volver, las pantallas se recargan solas
    function huboCambio() { version++; }

    // Crea un elemento: h('div', { class: 'x', onclick: f }, hijos...)
    function h(tag, props) {
      var el = document.createElement(tag);
      if (props) Object.keys(props).forEach(function (k) {
        var v = props[k];
        if (v === null || v === undefined || v === false) return;
        if (k === 'class') el.className = v;
        else if (k === 'text') el.textContent = v;
        else if (k.indexOf('on') === 0) el.addEventListener(k.substring(2), v);
        else if (k === 'style') el.setAttribute('style', v);
        else if (k in el && k !== 'list') el[k] = v;
        else el.setAttribute(k, v === true ? '' : v);
      });
      for (var i = 2; i < arguments.length; i++) poner(el, arguments[i]);
      return el;
    }

    // Números y fechas a la española
    function miles(n) {
      var x = Math.round(Number(n) || 0);
      return (x < 0 ? '-' : '') + String(Math.abs(x)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }
    function km(n) { return miles(n) + ' km'; }
    function eur(n) {
      var x = Math.round((Number(n) || 0) * 100);
      var neg = x < 0; x = Math.abs(x);
      return (neg ? '-' : '') + miles(Math.floor(x / 100)) + ',' + ('0' + (x % 100)).slice(-2) + ' €';
    }
    function eurCorto(n) { return eur(n).replace(',00 €', ' €'); }
    function eurFino(n) {
      return (Number(n) || 0).toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 3 }) + ' €';
    }
    var MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
    var MESES_C = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
    var DIAS_SEMANA = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
    function textoDia(d) {
      return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
    }
    function hoyTexto() { return textoDia(new Date()); }
    // "2026-11-12" -> "12 nov 2026"
    function fechaBonita(iso) {
      var s = String(iso || '');
      if (s.length < 10) return s || '?';
      return Number(s.substring(8, 10)) + ' ' + MESES_C[Number(s.substring(5, 7)) - 1] + ' ' + s.substring(0, 4);
    }
    // "12/11/2026" -> "12 nov 2026"
    function fechaDMY(t) {
      var m = String(t || '').match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
      return m ? fechaBonita(m[3] + '-' + m[2] + '-' + m[1]) : (t || '?');
    }
    function textoDias(n) { return n + (n === 1 ? ' día' : ' días'); }
    function mayuscula(t) { t = String(t || ''); return t.charAt(0).toUpperCase() + t.substring(1); }
    function sinTildes(t) { return String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }

    // ---------- Avisos: colores y textos ----------
    // verde = bien · azul = próximo (80 %) · amarillo = desde el 95 % · rojo = vencida · gris = sin aviso
    var COLOR = { vencida: 'var(--rojo)', aviso: 'var(--amarillo)', proximo: 'var(--azul)', ok: 'var(--verde)' };
    function colorEstado(estado, sinAviso) { return sinAviso ? 'var(--gris)' : (COLOR[estado] || 'var(--gris)'); }

    function textoFalta(t) {
      var partes = [];
      if (t.faltaKm != null) {
        if (t.faltaKm > 0) partes.push('faltan ' + km(t.faltaKm));
        else if (t.faltaKm === 0) partes.push('toca ya');
        else partes.push(km(-t.faltaKm) + ' tarde');
      }
      if (t.faltaDias != null) {
        if (t.faltaDias > 0) partes.push('faltan ' + textoDias(t.faltaDias));
        else if (t.faltaDias === 0) partes.push('toca hoy');
        else partes.push(textoDias(-t.faltaDias) + ' tarde');
      }
      return partes.join(' · ');
    }
    function textoReloj(t) {
      var partes = [];
      if (t.cadaKm != null && t.cadaKm !== '') partes.push(km(t.cadaKm));
      if (t.cadaDias != null && t.cadaDias !== '') partes.push(textoDias(Number(t.cadaDias)));
      return partes.length ? 'cada ' + partes.join(' o ') : 'sin reloj';
    }
    // La tarea con el % más alto de una pieza (o null si no tiene relojes)
    function peorTarea(p) {
      var peor = null;

        if (t.pct != null && (!peor || t.pct > peor.pct)) peor = t;
      });
      return peor;
    }

      var c = { rojos: 0, amarillos: 0 };
      piezas.forEach(function (p) {
        if (p.sinAviso) return;
        (p.tareas || []).forEach(function (t) {
          if (t.estado === 'vencida') c.rojos++;
          if (t.estado === 'aviso') c.amarillos++;
        });
      });
      return c;
    }

    // ---------- Mensaje flotante ----------
    var relojMensaje = null;
    function avisar(texto) {
      var m = document.getElementById('mensaje');

      var esError = texto.indexOf('Error') === 0;
      m.textContent = esError ? texto + '  ✕' : texto;
      m.className = esError ? 'error' : '';
      if (!esError && texto.indexOf('...') === -1) relojMensaje = setTimeout(function () { m.className = 'oculto'; }, 3500);
    }

    // =====================================================================
    //  Conexión con la hoja (la "puerta" de Apps Script)
    // =====================================================================

    // La dirección de la puerta y la clave NO van en este archivo: se escriben una vez
    // en la pantalla de conexión y se guardan en este navegador (localStorage).
    var GUARDA_URL = 'biketenance.puerta';
    var GUARDA_CLAVE = 'biketenance.clave';
    var conf = leerConfig();   // copia en memoria (sirve aunque el navegador no deje guardar)

    function leerConfig() {
      try { return { url: localStorage.getItem(GUARDA_URL) || '', clave: localStorage.getItem(GUARDA_CLAVE) || '' }; }
      catch (e) { return { url: '', clave: '' }; }
    }
    function guardarConfig(url, clave) {
      conf = { url: url, clave: clave };
      try { localStorage.setItem(GUARDA_URL, url); localStorage.setItem(GUARDA_CLAVE, clave); return true; }
      catch (e) { return false; }
    }
    function olvidarConfig() {
      conf = { url: '', clave: '' };
      try { localStorage.removeItem(GUARDA_URL); localStorage.removeItem(GUARDA_CLAVE); } catch (e) { /* nada */ }
    }

    // Manda { k: clave, f: función, a: [argumentos] } a la puerta y devuelve su respuesta { ok, r, error }.
    // Va como texto (text/plain) para que el navegador no haga la pregunta previa de CORS.
    function pedirPuerta(url, clave, funcion, args) {
      return fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ k: clave, f: funcion, a: args || [] })
      }).catch(function () {
        throw new Error(navigator.onLine === false ? 'Sin internet. Prueba otra vez cuando tengas cobertura.'
          : 'No llego a la puerta. Mira la cobertura y que la dirección esté bien.');
      }).then(function (resp) {
        return resp.text().then(function (texto) {
          try { return JSON.parse(texto); }
          catch (e) { throw new Error('La puerta no ha contestado bien (código ' + resp.status + '). ¿Es la dirección de "fase 5 puerta"?'); }
        });
      });
    }

    // ---------- Hablar con el servidor ----------
    // llamar('funcion', [argumentos], alAcabarBien, alFallar) — igual que antes con google.script.run
    function llamar(funcion, args, ok, ko) {
      function fallo(texto) { if (ko) ko(new Error(texto)); else avisar('Error: ' + texto); }
      if (!conf.url || !conf.clave) { mostrarConfig({ primera: true }); fallo('Falta conectar la app con tu hoja.'); return; }
      pedirPuerta(conf.url, conf.clave, funcion, args).then(function (res) {
        if (res && res.ok) { if (ok) ok(res.r); return; }
        var texto = (res && res.error) || 'Respuesta rara del servidor.';
        if (texto === 'Clave incorrecta.') mostrarConfig({ motivo: 'La clave guardada no vale. Escribe la buena.' });
        fallo(texto);
      }, function (e) {
        fallo(e.message);
      }).catch(function (e) { if (window.console) console.error(e); });
    }

    // Botón que guarda: se bloquea mientras tanto y, si va bien, apunta que hubo cambios
    function guardar(boton, funcion, args, textoOk, despues) {
      boton.disabled = true;
      avisar('Guardando...');
      llamar(funcion, args, function (res) {
        huboCambio();
        avisar(typeof textoOk === 'function' ? textoOk(res) : textoOk);
        if (despues) despues(res);
      }, function (e) {
        boton.disabled = false;
        avisar('Error: ' + e.message);
      });
    }

    // Botón de doble pulsación para lo delicado
    function botonSeguro(texto, textoSeguro, clase, accion) {
      var listo = false;
      var b = h('button', { type: 'button', class: 'boton ancho ' + (clase || 'peligro'), text: texto });
      b.addEventListener('click', function () {
        if (!listo) { listo = true; b.textContent = textoSeguro; b.classList.add('seguro'); return; }
        accion(b);
      });

    function pilaActual() { return pilas[tabActual]; }

    // ---------- Botón "atrás" del móvil ----------
    // Cada pantalla que se abre y cada cambio de pestaña deja una marca en el historial del navegador (pushState):
    // { tab, n, i } = en qué pestaña estabas y cuántas pantallas tenías abiertas. Al dar "atrás" en el móvil,
    // el navegador nos devuelve la marca anterior (popstate) y dejamos la app tal cual estaba. Sin marcas (portada del Garaje), sale.
    var historiaOk = !!(window.history && window.history.pushState);

    var ignorarHistoriaHasta = 0;

    function alCambiarHistoria(e) {

      if (capaConfig) return;   // con la pantalla de conexión delante no se mueve nada

      contenedor.appendChild(p.el);
      p.el.getBoundingClientRect(); // fuerza el dibujo antes de animar

      if (anterior) anterior.el.classList.add('detras');
      actualizarBarra();
      marcar();
      mostrar(p);

    // Botón "volver" de la app (y al terminar un formulario)

      var s = pilaActual();

    function quitarArriba() {
      var s = pilaActual();

    // =====================================================================
    //  Intervals: sumar km solos al abrir
    // =====================================================================

    var sync = { estado: 'nada', r: null, error: '' }; // estado: nada | mirando | ok | error

    // =====================================================================

    var G = null; // último garaje recibido: { bicis, bajas, avisos }

    function pantallaGaraje() {

    // irA = { grupo, nombre }: al cargar, abre esa pieza directamente
    function pantallaBici(b, irA) {
      var editar = h('button', { type: 'button', class: 'boton-ico limpio', 'aria-label': 'Editar bici',
        onclick: function () { empujar(pantallaEditarBici(b)); } }, icono('lapiz', 22));
      var p = nuevaPantalla({ titulo: b.nombre, derecha: [editar] });
      var piezas = null;
      var mants = null;
      var vista = 'piezas';
      var gruposAbiertos = {};   // de entrada, todos los grupos plegados
      var heroe = h('div');
      var segmento = h('div', { class: 'segmento', style: 'margin-bottom:6px' });
      var zona = h('div');
      poner(p.cuerpo, [heroe, segmento, zona]);

      p.recargar = function () {

        llamar('cargarGaraje', [], function (d) {
          ponerG(d);
          var nueva = d.bicis.filter(function (x) { return x.id === b.id; })[0];
          if (!nueva) { if (arriba() === p) atras(); return; }
          Object.assign(b, nueva);
          listo();
        });
        llamar('listarPiezas', [b.id], function (lista) { piezas = lista; listo(); }, function (e) {
          vaciar(zona).appendChild(vacio('aviso', 'No he podido cargar las piezas', e.message));
        });

      function cargarMants() {
        llamar('listarMantenimientos', [b.id], function (lista) { mants = lista; if (vista === 'mant') pintarZona(); });

      function pintarTodo() {
        p.titulo.textContent = b.nombre;
        var c = contarAvisos(piezas);
        vaciar(heroe).appendChild(h('div', { class: 'heroe' },
          h('span', { style: 'position:absolute;right:14px;top:12px;color:var(--naranja);opacity:.9' }, iconoBici(b.tipo, 92)),
          h('span', { class: 'tipo', text: b.tipo }),
          h('div', { class: 'grande' }, miles(b.km), h('small', { text: 'km' })),
          h('div', { class: 'mini' },
            h('div', null, h('b', { text: piezas.length }), 'piezas'),
            h('div', null, h('b', { style: c.rojos ? 'color:var(--rojo)' : (c.amarillos ? 'color:var(--amarillo)' : 'color:var(--verde)'),
              text: c.rojos + c.amarillos }), 'avisos'),
            b.fechaCompra ? h('div', null, h('b', { text: fechaBonita(b.fechaCompra).replace(/^\d+ /, '') }), 'comprada') : null)));
        vaciar(segmento);
        [['piezas', 'Piezas'], ['mant', 'Mantenimientos']].forEach(function (s) {
          segmento.appendChild(h('button', { type: 'button', class: vista === s[0] ? 'si' : '', text: s[1], onclick: function () {
            vista = s[0];

        });
        pintarZona();

          var objetivo = piezas.filter(function (x) { return irA.id ? x.id === irA.id : (x.grupo === irA.grupo && x.nombre === irA.nombre); })[0];
          irA = null;
          if (objetivo) empujar(pantallaPieza(b, objetivo));

      }

      function pintarZona() {
        vaciar(zona);
        if (vista === 'mant') { pintarMants(); return; }

        // Lo que pide atención
        var avisos = [];
        piezas.forEach(function (pz) {
          if (pz.sinAviso) return;
          pz.tareas.forEach(function (t) { if (t.estado === 'vencida' || t.estado === 'aviso') avisos.push({ p: pz, t: t }); });

            var color = colorEstado(a.t.estado, false);
            la.appendChild(fila({ raya: color, t1: a.p.nombre + ' · ' + a.t.nombre, t2: textoFalta(a.t),
              derecha: pastilla(a.t.pct + '%', color), alPulsar: function () { empujar(pantallaPieza(b, a.p)); } }));
          });

        }

        // Piezas por grupos
        zona.appendChild(seccion('Piezas', piezas.length + ' montadas'));
        if (!piezas.length) zona.appendChild(vacio('herramienta', 'Sin piezas', 'Añade la primera con el botón de abajo.'));
        var orden = [], porGrupo = {};
        piezas.forEach(function (pz) {
          if (!porGrupo[pz.grupo]) { porGrupo[pz.grupo] = []; orden.push(pz.grupo); }

        orden.forEach(function (g) {
          var lista = h('div', { class: 'lista grupo' });

              t1: pz.nombre, t2: km(pz.km) + (pz.tareas.length ? ' · ' + pz.tareas.length + (pz.tareas.length === 1 ? ' tarea' : ' tareas') : ''),

            }));

        zona.appendChild(h('button', { type: 'button', class: 'boton ancho', style: 'margin-top:8px',

      function pintarMants() {

          onclick: function () { empujar(pantallaMant(b, piezas, null)); } }, icono('mas', 20), 'Apuntar mantenimiento'));
        if (!mants) { poner(zona, esqueleto([120, 90, 90])); return; }
        if (!mants.length) { zona.appendChild(vacio('llave', 'Nada apuntado todavía', 'Aquí saldrán lavados, engrases, cambios de pieza...')); return; }
        var tp = 0, tm = 0;

        zona.appendChild(h('div', { class: 'tarjeta', style: 'margin-bottom:12px' },

    function pantallaPieza(b, pz) {

          if (!nueva) { if (arriba() === p) atras(); return; }

        p.titulo.textContent = pz.nombre;
        vaciar(p.cuerpo);

              h('button', { type: 'button', class: 'boton-ico limpio', 'aria-label': 'Editar tarea',

            t.pct != null ? h('div', { class: 'medidor' }, h('i', { style: 'width:' + Math.min(100, t.pct) + '%;background:' + c })) : null,
            h('div', { class: 'pie-t', style: t.pct == null ? 'margin-top:12px' : null },
              h('span', { class: 'sub' }, t.pct != null ? h('b', { style: 'color:' + c, text: t.pct + '% ' }) : null, textoFalta(t) || ''),
              h('button', { type: 'button', class: 'boton principal chico', onclick: function () {
                if (t.tipo === 'cambio') empujar(pantallaSustituir(b, pz, 'Cambiar ' + pz.nombre));

    function pantallaInformes() {

            per.appendChild(h('button', { type: 'button', class: 'chip' + (inf.periodo === x[0] ? ' si' : ''), text: x[1], onclick: function () {

            pistas.length ? h('div', { class: 'sub', style: 'margin-top:10px;color:var(--tenue)', text: 'Para completarlo: pon ' + pistas.join(' y ') + ' en Editar bici.' }) : null));
        });
      }

      return p;
    }

    // =====================================================================
    //  AJUSTES
    // =====================================================================

    function pantallaAjustes() {
      var p = nuevaPantalla({ raiz: true });
      var zonaSync = h('div', { class: 'tarjeta' });
      var zonaConexion = h('div', { class: 'tarjeta' });
      var zonaBajas = h('div');
      poner(p.cuerpo, [h('div', { class: 'titulo-grande' }, h('div', null, h('div', { class: 'pre', text: 'Conexiones y cosas de la app' }), h('h1', { text: 'Ajustes' }))),
        seccion('Intervals.icu'), zonaSync, seccion('Conexión con tu hoja'), zonaConexion, seccion('Bicis dadas de baja'), zonaBajas]);

      function pintarSync() {
        vaciar(zonaSync);
        var e = estadoSyncTexto();
        var boton = h('button', { type: 'button', class: 'boton ancho' + (sync.estado === 'mirando' ? ' girando' : ''), style: 'margin-top:14px',
          onclick: sincronizar, disabled: sync.estado === 'mirando' }, icono('sync', 20), 'Mirar Intervals ahora');
        poner(zonaSync, [h('div', { style: 'display:flex;gap:10px;align-items:center' }, h('span', { class: 'punto', style: 'background:' + e.color }), h('b', { text: e.texto })),
          h('p', { class: 'sub', text: 'Al abrir la app se suman solas las salidas nuevas de las bicis vinculadas y se corrigen los cambios de los últimos 30 días. Para vincular una bici: entra en ella › lápiz › Intervals.' })]);
        var sinBici = (sync.r && sync.r.sinBici) || [];
        if (sinBici.length) {
          zonaSync.appendChild(h('div', { style: 'color:var(--amarillo);font-weight:700;margin:12px 0 6px', text: '⚠️ Salidas sin bici: ponles bici en Intervals y se sumarán solas' }));
          sinBici.slice(0, 8).forEach(function (s) { zonaSync.appendChild(h('div', { class: 'sub', text: '· ' + fechaBonita(s.fecha) + ' · ' + s.nombre + ' · ' + km(s.km) })); });
          if (sinBici.length > 8) zonaSync.appendChild(h('div', { class: 'sub', text: '· y ' + (sinBici.length - 8) + ' más' }));
        }
        zonaSync.appendChild(boton);
      }
      vigilantesSync.push(pintarSync);
      pintarSync();

      // Dirección de la puerta y clave (guardadas en este navegador)
      function pintarConexion() {
        vaciar(zonaConexion);
        var corta = conf.url ? 'script.google.com/…' + conf.url.replace(/\/exec$/, '').slice(-8) + '/exec' : 'sin dirección';
        poner(zonaConexion, [
          h('div', { style: 'display:flex;gap:10px;align-items:center' }, h('span', { class: 'punto', style: 'background:var(--verde)' }), h('b', { text: 'Guardada en este dispositivo' })),
          h('p', { class: 'sub', style: 'word-break:break-all', text: 'Puerta: ' + corta + ' · Clave: ••••••' }),
          h('button', { type: 'button', class: 'boton ancho', onclick: function () { mostrarConfig({}); } }, icono('enlace', 20), 'Cambiar dirección o clave'),
          h('div', { style: 'margin-top:10px' }, botonSeguro('Olvidar en este dispositivo', '¿Seguro? Tendrás que volver a escribirlas', 'peligro', function () {
            olvidarConfig();
            mostrarConfig({ primera: true });
          }))]);
      }

      p.recargar = function () {
        pintarConexion();
        vaciar(zonaBajas);
        poner(zonaBajas, esqueleto([70]));
        llamar('cargarGaraje', [], function (d) {
          ponerG(d);
          vaciar(zonaBajas);
          if (!d.bajas.length) { zonaBajas.appendChild(h('div', { class: 'tarjeta sub', text: 'Ninguna. Cuando des de baja una bici (lápiz › Zona peligrosa) aparecerá aquí con su historial guardado.' })); return; }
          var lista = h('div', { class: 'lista' });
          d.bajas.forEach(function (b) {
            var rec = h('button', { type: 'button', class: 'boton chico', text: 'Recuperar' });
            rec.addEventListener('click', function () { guardar(rec, 'recuperarBici', [b.id], 'Bici recuperada ✅', function () { mostrar(p); }); });
            lista.appendChild(fila({ icono: h('span', { style: 'color:var(--tenue)' }, iconoBici(b.tipo, 30)), t1: b.nombre, t2: mayuscula(b.tipo) + ' · ' + km(b.km), derecha: rec }));
          });
          zonaBajas.appendChild(lista);
        });
      };

      // Leyenda de colores
      function leyenda(color, titulo, texto) {
        return h('div', { style: 'display:flex;gap:12px;align-items:flex-start;padding:8px 0' }, h('span', { class: 'punto', style: 'width:12px;height:12px;border-radius:6px;margin-top:4px;background:' + color }),
          h('div', null, h('b', { text: titulo }), h('div', { class: 'sub', text: texto })));
      }
      poner(p.cuerpo, [seccion('Qué significan los colores'), h('div', { class: 'tarjeta' },
        leyenda('var(--verde)', 'Bien', 'Menos del 95 % gastado.'),
        leyenda('var(--azul)', 'Próximo', 'Del 80 al 95 %: sale solo en la pestaña Avisos, para ir comprando.'),
        leyenda('var(--amarillo)', 'Aviso', 'Desde el 95 %: ve preparándolo.'),
        leyenda('var(--rojo)', 'Vencida', 'Del 100 % en adelante: ya toca.'),
        leyenda('var(--gris)', 'Sin aviso', 'Pieza con los avisos apagados.')),
        seccion('Acerca de'), h('div', { class: 'tarjeta' }, h('b', { text: 'Biketenance' }),
          h('p', { class: 'sub', text: 'Tus datos viven en tu hoja de Google "Mantenimiento Bicis": puedes abrirla o descargarla cuando quieras.' }),
          h('div', { class: 'sub', text: 'Versión: ' + VERSION_APP }))]);
      return p;
    }

    // =====================================================================
    //  Arranque
    // =====================================================================

    var arrancada = false;
    function arrancar() {
      if (arrancada) return;
      arrancada = true;
      montarBarra();
      var raiz = pantallaGaraje();
      pilas.garaje.push(raiz);
      contenedor.appendChild(raiz.el);
      actualizarBarra();
      mostrar(raiz);
      sincronizar();
    }

    document.getElementById('mensaje').addEventListener('click', function () { avisar(''); });
    // Si se recarga la página, la marca vieja del historial ya no sirve: se limpia
    try { if (historiaOk && window.history.state) window.history.replaceState(null, ''); } catch (e) { /* nada */ }
    if (conf.url && conf.clave) arrancar();
    else mostrarConfig({ primera: true });

    // App instalable: da de alta el "mozo de almacén" (sw.js). Si el navegador no lo admite, la app funciona igual.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (e) { if (window.console) console.warn('Sin service worker:', e); });
      });
    }
  </script>
</body>
</html>
